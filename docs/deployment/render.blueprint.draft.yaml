# Draft Render Blueprint for Agent-Ledger. Verify field names against
# https://render.com/docs/blueprint-spec before deploying.
# Render Workflows are set up separately (see Render Workflows docs/SDK).
envVarGroups:
  - name: ledger-secrets
    envVars:
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_ENV
        value: sandbox
      - key: SARVAM_API_KEY
        sync: false

databases:
  - name: ledger-db
    plan: basic-256mb

services:
  - type: keyvalue
    name: ledger-kv
    plan: starter
    ipAllowList: []

  - type: web
    name: ledger-api
    runtime: python
    buildCommand: uv sync --frozen
    startCommand: uv run uvicorn backend.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - fromGroup: ledger-secrets
      - key: DATABASE_URL
        fromDatabase: { name: ledger-db, property: connectionString }
      - key: REDIS_URL
        fromService: { type: keyvalue, name: ledger-kv, property: connectionString }

  - type: web
    name: ledger-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        fromService: { type: web, name: ledger-api, envVarKey: RENDER_EXTERNAL_URL }

  # One private MCP server per department (repeat for each plugin)
  - type: pserv
    name: mcp-finance
    runtime: python
    buildCommand: uv sync --frozen
    startCommand: uv run python -m backend.plugins.finance.mcp_server
    envVars:
      - fromGroup: ledger-secrets
      - key: DATABASE_URL
        fromDatabase: { name: ledger-db, property: connectionString }

  - type: pserv
    name: mcp-procurement
    runtime: python
    buildCommand: uv sync --frozen
    startCommand: uv run python -m backend.plugins.procurement.mcp_server
    envVars:
      - fromGroup: ledger-secrets
      - key: DATABASE_URL
        fromDatabase: { name: ledger-db, property: connectionString }

  # One background worker per department agent (repeat for each plugin)
  - type: worker
    name: agent-treasury
    runtime: python
    buildCommand: uv sync --frozen
    startCommand: uv run python -m backend.workers.run --agent treasury
    envVars:
      - fromGroup: ledger-secrets
      - key: REDIS_URL
        fromService: { type: keyvalue, name: ledger-kv, property: connectionString }

  - type: worker
    name: agent-collections
    runtime: python
    buildCommand: uv sync --frozen
    startCommand: uv run python -m backend.workers.run --agent collections
    envVars:
      - fromGroup: ledger-secrets
      - key: REDIS_URL
        fromService: { type: keyvalue, name: ledger-kv, property: connectionString }

  - type: cron
    name: nightly-paypal-recon
    runtime: python
    schedule: "30 20 * * *"   # 02:00 IST
    buildCommand: uv sync --frozen
    startCommand: uv run python -m backend.jobs.trigger --workflow paypal_recon
    envVars:
      - fromGroup: ledger-secrets
